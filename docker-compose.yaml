services:
    test-docker-controller-bot:
        container_name: test-docker-controller-bot
        env_file:
          - .env
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock # NO CAMBIAR
          # El código, y aparte los datos del bot, que siguen en la raíz del repositorio
          - ./src:/app # CAMBIAR LA PARTE IZQUIERDA
          - ./config:/app/config
          # Solo si se van a probar hosts ssh://. En solo lectura: el bot no
          # tiene por qué escribir en known_hosts, y así no puede.
          - ~/.ssh:/root/.ssh:ro
        build:
          context: .
          dockerfile: dev/Dockerfile_local
